name: Animate contribution grid

on:
  schedule:
    - cron: "13 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/snake.yml"

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - name: Generate light and dark SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: BadrELJAOUHARI
          outputs: |
            dist/github-snake.svg?color_snake=#E7BA78&color_dots=#EDF3F0,#BEDDD6,#88C9BD,#4E9F96,#2C706F
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#E7BA78

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
